name: namdevOS Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('packages/*.list.chroot') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck python3-yaml

      - name: Run validation
        run: bash scripts/validate.sh

  build:
    name: Build ISO
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-build-${{ runner.os }}-${{ hashFiles('packages/*.list.chroot') }}
          restore-keys: |
            apt-build-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            syslinux-utils \
            mtools \
            grub-efi-amd64 \
            grub-efi-amd64-signed \
            grub-efi-amd64-bin \
            shim-signed

      - name: Patch lb_binary_syslinux
        run: |
          # Patch ALL live-build scripts that reference the obsolete syslinux
          # theme paths (ubuntu-oneiric, isolinux-live, syslinux-themes-*).
          # These themes don't exist in Ubuntu 24.04+.
          echo "Searching for live-build scripts with theme references..."
          FOUND=0
          for SCRIPT in $(find /usr/lib/live /usr/share/live /usr/lib/live-build -type f 2>/dev/null); do
            if grep -qlE 'syslinux-themes-|gfxboot-theme|ubuntu-oneiric|isolinux-live' "$SCRIPT" 2>/dev/null; then
              sudo sed -i \
                -e '/syslinux-themes-/s/^/# PATCHED: /' \
                -e '/gfxboot-theme-ubuntu/s/^/# PATCHED: /' \
                -e '/ubuntu-oneiric/s/^/# PATCHED: /' \
                -e 's|cp.*syslinux/themes.*|true  # PATCHED|g' \
                -e 's|cp.*isolinux-live.*|true  # PATCHED|g' \
                "$SCRIPT"
              echo "Patched: $SCRIPT"
              FOUND=$((FOUND + 1))
            fi
          done
          # Create fake theme directory as a safety net
          sudo mkdir -p /usr/share/syslinux/themes/ubuntu-oneiric/isolinux-live
          sudo touch /usr/share/syslinux/themes/ubuntu-oneiric/isolinux-live/.placeholder
          echo "Patched $FOUND script(s). Fake theme directory created as fallback."

      - name: Build ISO
        run: sudo bash build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: namdevos-iso
          path: output/*.iso
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: namdevos-iso
          path: release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/*.iso \
            --repo "${{ github.repository }}" \
            --title "namdevOS $TAG" \
            --generate-notes
