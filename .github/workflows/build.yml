name: namdevOS Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('packages/*.list.chroot') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck python3-yaml

      - name: Run validation
        run: bash scripts/validate.sh

  build:
    name: Build ISO
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-build-${{ runner.os }}-${{ hashFiles('packages/*.list.chroot') }}
          restore-keys: |
            apt-build-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-utils \
            grub-efi-amd64 \
            grub-efi-amd64-signed \
            shim-signed

      - name: Patch lb_binary_syslinux
        run: |
          # gfxboot-theme-ubuntu appears literally in the script — sed handles it
          SCRIPT=$(dpkg -L live-build 2>/dev/null | grep -m1 'lb_binary_syslinux$' || true)
          [ -z "$SCRIPT" ] && SCRIPT=$(find /usr/lib/live /usr/share/live -name lb_binary_syslinux 2>/dev/null | head -1)
          if [ -n "$SCRIPT" ] && [ -f "$SCRIPT" ]; then
            sudo sed -i 's/.*gfxboot-theme-ubuntu.*/true/' "$SCRIPT"
            echo "Patched gfxboot in: $SCRIPT"
          else
            echo "lb_binary_syslinux not found — skipping gfxboot patch"
          fi

          # syslinux-themes-ubuntu-oneiric is built from a config variable, not a
          # literal string in the script, so sed cannot intercept it. Pre-install a
          # dummy package so apt-get sees it as already satisfied.
          mkdir -p /tmp/faketheme/DEBIAN
          printf 'Package: syslinux-themes-ubuntu-oneiric\nVersion: 99.0\nArchitecture: all\nMaintainer: CI <ci@localhost>\nDescription: Dummy package to satisfy live-build\n' \
            > /tmp/faketheme/DEBIAN/control
          dpkg-deb --build /tmp/faketheme /tmp/syslinux-themes-ubuntu-oneiric_99.0_all.deb
          sudo dpkg -i /tmp/syslinux-themes-ubuntu-oneiric_99.0_all.deb
          # create empty theme dir so any subsequent cp of theme files is a no-op
          sudo mkdir -p /usr/share/syslinux/themes/ubuntu-oneiric
          echo "Installed dummy syslinux-themes-ubuntu-oneiric"

      - name: Build ISO
        run: sudo bash build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: namdevos-iso
          path: output/*.iso
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: namdevos-iso
          path: release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/*.iso \
            --repo "${{ github.repository }}" \
            --title "namdevOS $TAG" \
            --generate-notes
