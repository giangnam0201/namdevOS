name: namdevOS Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('packages/*.list.chroot') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck python3-yaml

      - name: Run validation
        run: bash scripts/validate.sh

  build:
    name: Build ISO
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-build-${{ runner.os }}-${{ hashFiles('packages/*.list.chroot') }}
          restore-keys: |
            apt-build-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux \
            syslinux-common \
            syslinux-utils \
            mtools \
            genisoimage \
            grub-efi-amd64 \
            grub-efi-amd64-signed \
            grub-efi-amd64-bin \
            shim-signed

      - name: Patch lb_binary_syslinux
        run: |
          # Patch lb_binary_syslinux to skip theme file copying.
          # We keep the script functional (it creates the isolinux/ boot directory)
          # but comment out lines that copy non-existent theme files.
          SCRIPT=$(dpkg -L live-build 2>/dev/null | grep -m1 'lb_binary_syslinux$' || true)
          [ -z "$SCRIPT" ] && SCRIPT=$(find /usr/lib/live /usr/share/live /usr/lib/live-build -name lb_binary_syslinux -type f 2>/dev/null | head -1)
          if [ -n "$SCRIPT" ] && [ -f "$SCRIPT" ]; then
            sudo sed -i \
              -e 's|^\(.*cp.*themes.*/isolinux-live\)|# PATCHED: \1|' \
              -e 's|^\(.*cp -r.*/usr/share/syslinux/themes\)|# PATCHED: \1|' \
              -e 's|^\(.*Packages_Install.*syslinux-themes\)|# PATCHED: \1|' \
              -e 's|^\(.*gfxboot-theme\)|# PATCHED: \1|' \
              "$SCRIPT"
            echo "Patched theme lines in: $SCRIPT"
          else
            echo "lb_binary_syslinux not found — skipping"
          fi
          # Clear the theme variable in defaults.sh
          DEFAULTS=$(find /usr/lib/live /usr/share/live /usr/lib/live-build -name "defaults.sh" -type f 2>/dev/null | head -1)
          if [ -n "$DEFAULTS" ] && [ -f "$DEFAULTS" ]; then
            sudo sed -i 's|LB_SYSLINUX_THEME=.*|LB_SYSLINUX_THEME=""|' "$DEFAULTS"
            echo "Cleared LB_SYSLINUX_THEME in: $DEFAULTS"
          fi
          # Create fake theme dirs as safety net
          sudo mkdir -p /usr/share/syslinux/themes/isolinux-live
          sudo mkdir -p /usr/share/syslinux/themes/ubuntu-oneiric/isolinux-live
          sudo touch /usr/share/syslinux/themes/isolinux-live/.keep
          sudo touch /usr/share/syslinux/themes/ubuntu-oneiric/isolinux-live/.keep

      - name: Build ISO
        run: sudo bash build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: namdevos-iso
          path: output/*.iso
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: namdevos-iso
          path: release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/*.iso \
            --repo "${{ github.repository }}" \
            --title "namdevOS $TAG" \
            --generate-notes
