name: namdevOS Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('packages/*.list.chroot') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck python3-yaml

      - name: Run validation
        run: bash scripts/validate.sh

  build:
    name: Build ISO
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-build-${{ runner.os }}-${{ hashFiles('packages/*.list.chroot') }}
          restore-keys: |
            apt-build-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            genisoimage \
            isolinux \
            syslinux \
            syslinux-common \
            syslinux-utils \
            mtools \
            grub-efi-amd64 \
            grub-efi-amd64-signed \
            grub-efi-amd64-bin \
            shim-signed

      - name: Build ISO
        run: sudo bash build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: namdevos-iso
          path: output/*.iso
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: namdevos-iso
          path: release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Split ISO if larger than 2GB (GitHub release asset limit)
          ISO_FILE=$(find release/ -name "*.iso" | head -1)
          ISO_SIZE=$(stat --format=%s "$ISO_FILE")
          MAX_SIZE=2000000000

          if [ "$ISO_SIZE" -gt "$MAX_SIZE" ]; then
            echo "ISO is ${ISO_SIZE} bytes (>2GB), splitting for upload..."
            split -b 1900m "$ISO_FILE" "release/namdevOS-${TAG}-part-"
            rm "$ISO_FILE"
            # Create a readme for reassembly
            echo "# namdevOS ${TAG}" > release/REASSEMBLE.md
            echo "" >> release/REASSEMBLE.md
            echo "The ISO was split into parts due to GitHub's 2GB file size limit." >> release/REASSEMBLE.md
            echo "" >> release/REASSEMBLE.md
            echo "## Reassemble on Linux/macOS:" >> release/REASSEMBLE.md
            echo '```' >> release/REASSEMBLE.md
            echo "cat namdevOS-${TAG}-part-* > namdevOS-${TAG}.iso" >> release/REASSEMBLE.md
            echo '```' >> release/REASSEMBLE.md
            echo "" >> release/REASSEMBLE.md
            echo "## Reassemble on Windows (PowerShell):" >> release/REASSEMBLE.md
            echo '```' >> release/REASSEMBLE.md
            echo "Get-Content namdevOS-${TAG}-part-* -ReadCount 0 -Encoding Byte | Set-Content namdevOS-${TAG}.iso -Encoding Byte" >> release/REASSEMBLE.md
            echo '```' >> release/REASSEMBLE.md

            gh release create "$TAG" release/* \
              --repo "${{ github.repository }}" \
              --title "namdevOS $TAG" \
              --generate-notes
          else
            gh release create "$TAG" "$ISO_FILE" \
              --repo "${{ github.repository }}" \
              --title "namdevOS $TAG" \
              --generate-notes
          fi
