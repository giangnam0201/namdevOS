# Users module configuration for namdevOS installer

defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: sudo
      must_exist: false
      system: true
    - name: docker
      must_exist: false
      system: true
    - name: plugdev
      must_exist: false
      system: true

autologinGroup: autologin

doAutologin: false

setRootPassword: true
doReusePassword: true

passwordRequirements:
    minLength: 8
    maxLength: -1
    libpwquality: []

allowWeakPasswords: false
allowWeakPasswordsDefault: false

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "namdevos-${first}"
    forbidden_names: [ localhost ]

presets:
    fullName:
        editable: true
    loginName:
        editable: true
