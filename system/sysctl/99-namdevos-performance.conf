# namdevOS Performance Tuning
# Optimized sysctl settings for developer workstations

# --- Memory Management ---
# Reduce swap usage - prefer keeping data in RAM
vm.swappiness = 10
# Increase the percentage of dirty pages before background writeback
vm.dirty_ratio = 20
vm.dirty_background_ratio = 5
# Reduce vfs cache pressure for better file caching
vm.vfs_cache_pressure = 50

# --- Network Performance ---
# Increase maximum socket connections
net.core.somaxconn = 65535
# Increase network buffer sizes
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
# Enable TCP Fast Open for reduced latency
net.ipv4.tcp_fastopen = 3
# Reuse TIME_WAIT sockets for new connections
net.ipv4.tcp_tw_reuse = 1

# --- File System ---
# Increase inotify watches for file watchers (IDEs, build tools)
fs.inotify.max_user_watches = 524288
# Increase max open file instances
fs.inotify.max_user_instances = 1024
# Increase max queued events
fs.inotify.max_queued_events = 32768

# --- Security Hardening ---
# Restrict dmesg access to root
kernel.dmesg_restrict = 1
# Disable magic SysRq key (except sync + reboot)
kernel.sysrq = 176
