# namdevOS GRUB Configuration
# Custom theme colors and settings

# Timeout settings
set timeout=5
set timeout_style=menu

# Default boot entry
set default=0

# Theme colors
set menu_color_normal=white/black
set menu_color_highlight=white/dark-gray

# Custom color scheme
set color_normal=light-gray/black
set color_highlight=white/dark-gray

# Boot menu entries styling
menuentry "namdevOS" --class ubuntu --class os {
    set gfxpayload=keep
    linux /vmlinuz root=UUID=PLACEHOLDER ro quiet splash
    initrd /initrd.img
}

menuentry "namdevOS (Recovery Mode)" --class ubuntu --class os {
    linux /vmlinuz root=UUID=PLACEHOLDER ro recovery nomodeset
    initrd /initrd.img
}

menuentry "Memory Test (memtest86+)" --class memtest {
    linux16 /boot/memtest86+.bin
}
