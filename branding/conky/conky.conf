-- namdevOS Desktop Widget (Conky)
-- Minimal system info display in bottom-right corner

conky.config = {
    alignment = 'bottom_right',
    background = true,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = 'e0e0e0',
    color1 = 'e94560',
    color2 = '00d2d3',
    color3 = '533483',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'Inter:size=9',
    gap_x = 40,
    gap_y = 60,
    minimum_height = 200,
    minimum_width = 220,
    maximum_width = 220,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 2.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    xftalpha = 0.9,
}

conky.text = [[
${color1}${font Inter:bold:size=11}namdevOS${font}${color}
${color2}${hr 1}${color}
${voffset 5}${color1}CPU ${color}${cpu}% ${cpubar 6,120}
${color1}RAM ${color}${memperc}% ${membar 6,120}
${color1}DSK ${color}${fs_used_perc /}% ${fs_bar 6,120 /}
${voffset 5}${color2}${hr 1}${color}
${voffset 3}${color3}↑${color} ${upspeed wlp0s20f3}  ${color3}↓${color} ${downspeed wlp0s20f3}
${voffset 3}${color1}⏱${color} ${uptime_short}
${alignr}${color 666666}${font Inter:size=8}${time %H:%M}${font}${color}
]]
