# namdevOS Neofetch Configuration
# Custom ASCII art and info display

print_info() {
    info title
    info underline

    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "DE" de
    info "WM" wm
    info "Theme" theme
    info "Icons" icons
    info "Terminal" term
    info "Terminal Font" term_font
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info "Disk" disk
    info "Local IP" local_ip

    info cols
}

# Custom ASCII art for namdevOS
ascii_distro="namdevOS"

# Colors
colors=(1 1 5 5 6 7)

# Bold
bold="on"

# Underline character
underline_char="─"

# Info separator
separator=" ➜ "

# Color blocks
color_blocks="on"
block_range=(0 15)
block_width=3
block_height=1
col_offset="auto"

# Image backend
image_backend="ascii"
image_source="auto"

# Ascii options
ascii_colors=(1 5)
ascii_bold="on"

# Gap between image and text
gap=3

# OS shorthand
os_arch="on"
distro_shorthand="off"
kernel_shorthand="on"
uptime_shorthand="small"
memory_percent="on"
package_managers="on"
shell_path="off"
shell_version="on"
speed_type="bios_limit"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"
gpu_brand="on"
gpu_type="all"
disk_show=('/')
disk_subtitle="mount"
