<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#1a1a2e" />

  <!-- Circuit-board inspired "N" mark -->
  <g fill="none" stroke="url(#logo-gradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main N shape -->
    <path d="M 80 180 L 80 76 L 176 180 L 176 76" />
    <!-- Circuit nodes -->
    <circle cx="80" cy="76" r="6" fill="#e94560" stroke="none" />
    <circle cx="176" cy="76" r="6" fill="#e94560" stroke="none" />
    <circle cx="80" cy="180" r="6" fill="#0f3460" stroke="none" />
    <circle cx="176" cy="180" r="6" fill="#0f3460" stroke="none" />
    <!-- Circuit traces -->
    <path d="M 80 76 L 60 56" stroke-width="3" opacity="0.6" />
    <path d="M 176 76 L 196 56" stroke-width="3" opacity="0.6" />
    <path d="M 80 180 L 60 200" stroke-width="3" opacity="0.6" />
    <path d="M 176 180 L 196 200" stroke-width="3" opacity="0.6" />
  </g>

  <!-- namdevOS text below -->
  <text x="128" y="232" font-family="sans-serif" font-size="18" font-weight="bold"
        fill="#ffffff" text-anchor="middle" letter-spacing="1">
    namdevOS
  </text>
</svg>
